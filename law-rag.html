<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勞動法 RAG 問答 Demo</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --line: #dfe7f1;
        --text: #1e2c3a;
        --muted: #5d7286;
        --primary: #1c7ad6;
        --primary-soft: #eaf3ff;
        --accent: #0f766e;
        --warning: #f5a623;
        --danger: #c94949;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 18px 22px;
        margin-bottom: 24px;
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(23,40,59,0.04);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 1.1rem;
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        color: white;
        background: linear-gradient(135deg, var(--primary), #4cb0ff);
      }

      .chip {
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(16, 37, 56, 0.04);
      }

      .panel-main {
        padding: 26px 24px 18px;
      }

      .panel-side {
        padding: 22px 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.7;
      }

      .prompt-box {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      textarea {
        width: 100%;
        min-height: 140px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        font-size: 1rem;
        resize: vertical;
        background: #fafcff;
        color: var(--text);
      }

      textarea:focus {
        outline: 2px solid rgba(28,122,214,0.18);
        border-color: var(--primary);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), #358ce5);
        color: white;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(29,112,194,0.2);
      }

      .ghost {
        background: #eef5ff;
        color: var(--primary);
        box-shadow: none;
      }

      .result {
        margin-top: 22px;
        padding: 18px 18px 4px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(180deg, #f9fbff, #ffffff);
      }

      .answer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .answer-title {
        margin: 0;
        font-size: 1.1rem;
      }

      .badge {
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 999px;
        background: #edf9f6;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .answer-box {
        margin: 0;
        line-height: 1.9;
        color: var(--text);
        white-space: pre-line;
      }

      .source-list {
        margin-top: 18px;
        padding: 0;
        list-style: none;
      }

      .source-list li {
        margin-top: 10px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f8fbff;
        line-height: 1.7;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }

      .knowledge-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }

      .knowledge-item {
        padding: 12px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fafcff;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .knowledge-item:hover {
        transform: translateY(-1px);
        border-color: #bfdaf7;
      }

      .knowledge-title {
        font-weight: 700;
        margin-bottom: 7px;
      }

      .knowledge-text {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
      }

      .small-note {
        margin-top: 18px;
        font-size: 0.84rem;
        color: var(--muted);
        line-height: 1.8;
      }

      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark">RAG</span>
          <span>勞動法查詢問答 Demo</span>
        </div>
        <div class="chip">勞動法 / 檢索增強生成</div>
      </div>

      <div class="layout">
        <section class="panel panel-main">
          <h1>勞動法問答測試平台</h1>
          <p class="subtitle">
            這個示範頁面聚焦在勞動法主題，涵蓋加班費、休假、工時、薪資、解僱與申訴救濟等內容。
            先檢索相關勞動法知識，再整合內容回答問題，你也可以直接輸入問題或選擇右側的測試題目。
          </p>

          <div class="prompt-box">
            <textarea id="questionInput" placeholder="例如：公司沒有支付加班費，員工可怎麼處理？">公司沒有支付加班費，員工可以怎麼處理？</textarea>
            <div class="actions">
              <button id="askBtn">提交問題</button>
              <button class="ghost" id="clearBtn" type="button">清空</button>
            </div>
          </div>

          <div class="result">
            <div class="answer-head">
              <h2 class="answer-title">回答結果</h2>
              <span class="badge">檢索後答案</span>
            </div>
            <pre class="answer-box" id="answerBox">輸入問題後，這裡會顯示檢索後的回答。</pre>
            <ul class="source-list" id="sourcesList"></ul>
          </div>
        </section>

        <aside class="panel panel-side">
          <h2>測試問題</h2>
          <div class="knowledge-list" id="questionList"></div>

          <div class="small-note">
            這不是正式法律意見，僅作為 RAG 概念展示與前端原型測試。
            若要做正式法務系統，建議再接上完整法條資料庫、向量資料庫與事實驗證流程。
          </div>
        </aside>
      </div>
    </div>

    <script>
      const knowledgeBase = [
        {
          title: '勞動法：加班費',
          topic: '勞動法',
          keywords: ['加班費', '加班', '工作時間', '工資', '勞基法', '勞動', '工時'],
          content: '依勞動相關法規，員工於法定工作時間外工作，若符合加班認定，雇主通常需支付加班費。若雇主未支付，員工可先要求公司補發，必要時可向勞工行政主管機關申訴或透過司法途徑請求。計算加班費時，應依實際工時與工資計算基準，不能只用固定薪資代替。'
        },
        {
          title: '勞動法：休假與請假',
          topic: '勞動法',
          keywords: ['休假', '請假', '病假', '特休', '年假', '工時', '勞動'],
          content: '勞工依法享有休假權益，若因病假、年假、特別休假或其他法定事由，雇主須依法令及勞動契約規定處理。請假制度應公平合理，不得任意拒絕合法請假。'
        },
        {
          title: '勞動法：工時與休息',
          topic: '勞動法',
          keywords: ['工時', '休息', '休息時間', '值班', '加班', '輪班'],
          content: '勞動時間與休息時間原則上應受法令規範，雇主不得任意延長工時或剝奪法定休息。若員工因工作安排造成長時間連續工作，應依法要求休息與必要補償。'
        },
        {
          title: '勞動法：薪資與給付',
          topic: '勞動法',
          keywords: ['薪資', '工資', '給付', '支付', '月薪', '時薪'],
          content: '薪資給付通常應依勞動契約與法令規定確定，員工依法有權收取約定薪資與法定補償。若公司未如期支付，員工可依法主張救濟。'
        },
        {
          title: '勞動法：勞動契約與解除',
          topic: '勞動法',
          keywords: ['勞動契約', '契約', '解除', '終止', '離職', '解僱'],
          content: '勞動契約成立後，雙方應依約定及法令履行義務。若雇主或員工依法事由解除契約，應依相關程序處理，不得任意違反法令或契約規定。'
        },
        {
          title: '勞動法：申訴與救濟',
          topic: '勞動法',
          keywords: ['申訴', '勞資', '救濟', '勞工', '爭議', '主管機關'],
          content: '若勞工認為雇主違反勞動法令，通常可先透過書面主張、內部申訴或勞工行政機關申訴。必要時可透過勞資爭議調解或司法程序尋求救濟。'
        }
      ];

      const presetQuestions = [
        '公司沒有支付加班費，員工可以怎麼處理？',
        '職員請病假時，雇主可否拒絕？',
        '勞工每天的休息時間是怎麼規定的？',
        '公司未按時發薪，員工可以怎麼主張？',
        '勞動契約可以任意解除嗎？',
        '雇主可以直接解僱員工嗎？',
        '如果員工遭遇勞資爭議，該怎麼申訴？',
        '是否所有加班都要支付加班費？'
      ];

      function scoreKnowledge(question, entry) {
        const q = question.toLowerCase();
        let score = 0;
        for (const keyword of entry.keywords) {
          const k = keyword.toLowerCase();
          if (q.includes(k)) score += 2;
        }
        if (q.includes(entry.title.toLowerCase())) score += 1;
        return score;
      }

      function retrieve(question) {
        const scored = knowledgeBase
          .map(entry => ({ entry, score: scoreKnowledge(question, entry) }))
          .sort((a, b) => b.score - a.score)
          .filter(item => item.score > 0)
          .slice(0, 3);

        if (scored.length === 0) {
          return [{ entry: { title: '相關資料不足', content: '目前知識庫中沒有匹配到明確相關內容，建議補充法規資料或檢查問題是否過於抽象。' }, score: 0 }];
        }
        return scored;
      }

      function buildAnswer(question) {
        const relevant = retrieve(question);

        let conclusion = '';
        const q = question.toLowerCase();

        if (q.includes('加班') || q.includes('加班費') || q.includes('工時') || q.includes('勞工') || q.includes('休假') || q.includes('請假') || q.includes('病假') || q.includes('年假')) {
          conclusion = '若符合法定加班認定或休假法定申請事由，雇主通常不得任意拒絕，並須依法給付相應待遇。若發生爭議，員工可先主張、再申訴或尋求司法救濟。';
        } else if (q.includes('薪資') || q.includes('工資') || q.includes('發薪') || q.includes('支付')) {
          conclusion = '薪資給付通常應依勞動契約與法令規定確定，員工有權收取約定薪資與法定補償。未按時支付時，可以先主張補發，必要時透過申訴或爭議救濟程序處理。';
        } else if (q.includes('契約') || q.includes('解除') || q.includes('離職') || q.includes('解僱') || q.includes('終止')) {
          conclusion = '勞動契約解除與終止必須依契約及法令程序處理，雇主不得任意違反法律或恣意解雇員工，若有爭議可透過申訴或調解、訴訟途徑解決。';
        } else if (q.includes('休息') || q.includes('輪班') || q.includes('值班')) {
          conclusion = '勞動時間與休息時間原則上受法令規範，雇主不得任意延長工時或剝奪法定休息。若長時間連續工作，通常應依法提供休息與必要補償。';
        } else if (q.includes('申訴') || q.includes('勞資') || q.includes('爭議') || q.includes('主管機關')) {
          conclusion = '勞工若認為雇主違反勞動法令，可先以書面方式主張，必要時向勞工行政主管機關申訴，或透過勞資爭議調解與司法程序救濟。';
        } else {
          conclusion = '基於勞動法主題知識庫，建議先確認具體事實、適用法規與勞動契約內容，再做進一步法律評估。';
        }

        const sourceText = relevant.map(item => '- ' + item.entry.title + '：' + item.entry.content).join('\n');

        return {
          answer: [
            '結論：',
            conclusion,
            '',
            '依據：',
            sourceText,
            '',
            '注意事項：',
            '1. 這是 RAG 示範回答，不是正式法律意見。',
            '2. 若涉及實際案件，仍需確認事實、契約內容、法規適用與證據。',
            '3. 若資訊不足，應明確說明缺少法規或案例背景。'
          ].join('\n'),
          sources: relevant.map(item => item.entry.title + '：' + item.entry.content)
        };
      }

      function renderQuestionList() {
        const list = document.getElementById('questionList');
        for (const q of presetQuestions) {
          const item = document.createElement('div');
          item.className = 'knowledge-item';
          item.innerHTML = '<div class="knowledge-title">測試題目</div><div class="knowledge-text">' + q + '</div>';
          item.addEventListener('click', () => {
            document.getElementById('questionInput').value = q;
            ask();
          });
          list.appendChild(item);
        }
      }

      function ask() {
        const question = document.getElementById('questionInput').value.trim();
        if (!question) {
          document.getElementById('answerBox').textContent = '請先輸入問題。';
          document.getElementById('sourcesList').innerHTML = '';
          return;
        }

        const result = buildAnswer(question);
        document.getElementById('answerBox').textContent = result.answer;

        const sources = document.getElementById('sourcesList');
        sources.innerHTML = '';
        result.sources.forEach(source => {
          const li = document.createElement('li');
          li.textContent = source;
          sources.appendChild(li);
        });
      }

      document.getElementById('askBtn').addEventListener('click', ask);
      document.getElementById('clearBtn').addEventListener('click', () => {
        document.getElementById('questionInput').value = '';
        document.getElementById('answerBox').textContent = '輸入問題後，這裡會顯示檢索後的回答。';
        document.getElementById('sourcesList').innerHTML = '';
      });

      renderQuestionList();
      ask();
    </script>
  </body>
</html>
